# Install as /etc/nginx/conf.d/cheerfulmusic-logto.conf after both DNS records
# resolve and a certificate covering both names has been issued.
# The Admin Console is limited to loopback until trusted administrator IPs are
# added below. Never open ports 3001, 3002 or 5432 in the server firewall.

server {
    listen 80;
    server_name auth.cheerfulmusic.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/qingfeng-acme; }
    location / { return 301 https://auth.cheerfulmusic.com$request_uri; }
}

server {
    listen 80;
    server_name auth-admin.cheerfulmusic.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/qingfeng-acme; }
    location / { return 301 https://auth-admin.cheerfulmusic.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name auth.cheerfulmusic.com;
    ssl_certificate /etc/letsencrypt/live/cheerfulmusic-logto/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cheerfulmusic-logto/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Authorization URLs may contain login hints, and social callbacks contain
    # one-time codes. Do not put either in Nginx access logs or Referer headers.
    access_log off;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name auth-admin.cheerfulmusic.com;
    ssl_certificate /etc/letsencrypt/live/cheerfulmusic-logto/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cheerfulmusic-logto/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        # Add only known administrator public IPs, e.g. allow 203.0.113.4/32;
        # before the deny rule. A VPN or SSH tunnel is also suitable.
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
