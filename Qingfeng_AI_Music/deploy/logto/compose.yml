services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${LOGTO_DB_PASSWORD:?Set LOGTO_DB_PASSWORD in .env}
    volumes:
      - logto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 5s
      timeout: 5s
      retries: 10

  logto:
    image: ghcr.io/logto-io/logto:1.45.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      DB_URL: postgres://logto:${LOGTO_DB_PASSWORD:?Set LOGTO_DB_PASSWORD in .env}@postgres:5432/logto
      ENDPOINT: ${LOGTO_ENDPOINT:?Set LOGTO_ENDPOINT in .env}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:?Set LOGTO_ADMIN_ENDPOINT in .env}
      TRUST_PROXY_HEADER: ${LOGTO_TRUST_PROXY_HEADER:-0}
      SECRET_VAULT_KEK: ${LOGTO_SECRET_VAULT_KEK:?Set LOGTO_SECRET_VAULT_KEK in .env}
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"

volumes:
  logto_postgres:
