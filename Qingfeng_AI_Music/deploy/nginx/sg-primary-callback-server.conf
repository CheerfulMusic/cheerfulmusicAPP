# Singapore HTTPS server only. Preserve the same-site callback while suppressing OAuth codes in access logs.
location ~ ^/api/public/auth/(google|logto)/callback$ {
    access_log off;
    proxy_pass https://120.77.19.199;
    proxy_ssl_server_name on;
    proxy_ssl_name cheerfulmusic.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_set_header Host cheerfulmusic.com;
    proxy_set_header X-Forwarded-Host cheerfulmusic.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_next_upstream off;
}
