# Include only in the named Shenzhen fallback for Singapore static reads.
limit_conn qf_sg_static_fallback 4;
limit_conn_status 503;
limit_conn_log_level info;
proxy_connect_timeout 500ms;
proxy_send_timeout 1s;
proxy_read_timeout 1s;
proxy_next_upstream off;
add_header Retry-After $qf_sg_fallback_retry_after always;
