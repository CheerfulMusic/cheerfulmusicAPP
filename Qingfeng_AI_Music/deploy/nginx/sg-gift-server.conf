# Optional Singapore gift routing. Requires the public-read include and gift-enabled profile setting.
location ~ "^/gift/[A-Za-z0-9_-]{43}$" {
    limit_except GET { deny all; }
    limit_conn qf_sg_gift_checks 8;
    limit_conn_status 429;
    if ($qf_gift_token = "") { return 404; }
    auth_request /__qf_primary_gift_authority;
    auth_request_set $qf_gift_authorized $upstream_http_x_qf_share_status;
    auth_request_set $qf_gift_authority_status $upstream_status;
    auth_request_set $qf_gift_authority_seconds $upstream_response_time;
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
    proxy_set_header X-QF-Primary-Share-Authorized $qf_gift_authorized;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 500ms;
    proxy_read_timeout 1s;
    proxy_intercept_errors on;
    error_page 401 403 = @qingfeng_gift_invalid;
    error_page 404 500 502 503 504 = @qingfeng_sz_public_fallback;
    add_header X-QF-Origin singapore-read always;
    access_log /var/log/nginx/qingfeng-sg-gift.log qf_sg_regional;
    error_log /var/log/nginx/qingfeng-sg-gift-error.log crit;
}

location = /__qf_primary_gift_authority {
    internal;
    access_log off;
    error_log /var/log/nginx/qingfeng-sg-gift-error.log crit;
    proxy_pass https://120.77.19.199/api/public/gifts/$qf_gift_token;
    proxy_ssl_server_name on;
    proxy_ssl_name cheerfulmusic.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_method HEAD;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host cheerfulmusic.com;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 500ms;
    proxy_read_timeout 1s;
    proxy_next_upstream off;
    proxy_intercept_errors on;
    error_page 404 =403 /__qf_primary_gift_denied;
}

location = /__qf_primary_gift_denied {
    internal;
    access_log off;
    return 403;
}

location @qingfeng_gift_invalid {
    access_log /var/log/nginx/qingfeng-sg-gift.log qf_sg_regional;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    default_type text/html;
    return 404 '<!doctype html><meta charset="utf-8"><title>分享已失效 | Cheerful Music</title><h1>这首歌的分享已失效</h1>';
}
