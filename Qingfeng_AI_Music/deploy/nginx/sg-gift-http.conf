# Load at http scope together with sg-gift-server.conf.
limit_conn_zone $server_name zone=qf_sg_gift_checks:1m;
log_format qf_sg_regional escape=json
    '{"status":$status,"origin":"$sent_http_x_qf_origin","request_seconds":$request_time,'
    '"upstream_status":"$upstream_status","connect_seconds":"$upstream_connect_time",'
    '"header_seconds":"$upstream_header_time","upstream_seconds":"$upstream_response_time",'
    '"authority_status":"$qf_gift_authority_status","authority_seconds":"$qf_gift_authority_seconds"}';

map $request_uri $qf_gift_token {
    default "";
    "~^/gift/(?<qf_gift_path_token>[A-Za-z0-9_-]{43})(?:\?.*)?$" $qf_gift_path_token;
}
