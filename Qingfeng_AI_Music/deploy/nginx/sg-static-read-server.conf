# Include only in the Singapore HTTPS server for cheerfulmusic.com.
location ~ ^/(assets|brand|legal)/[a-zA-Z0-9_.-]+(/[a-zA-Z0-9_.-]+)*$ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
    proxy_connect_timeout 500ms;
    proxy_read_timeout 1s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @qingfeng_sz_static_fallback;
    add_header X-QF-Origin singapore-read always;
}

location @qingfeng_sz_static_fallback {
    limit_except GET { deny all; }
    include /etc/nginx/qingfeng/sg-fallback-budget.conf;
    access_log /var/log/nginx/qingfeng-sg-static-fallback.log qf_sg_static_fallback;
    proxy_pass https://120.77.19.199;
    proxy_ssl_server_name on;
    proxy_ssl_name cheerfulmusic.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
}
