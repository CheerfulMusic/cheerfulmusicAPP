# Include once at http scope. One shared admission budget across workers.
limit_conn_zone $server_name zone=qf_sg_static_fallback:1m;
limit_conn_zone $server_name zone=qf_sg_public_fallback:1m;
map $status $qf_sg_fallback_retry_after {
    default "";
    503 1;
    504 1;
}
log_format qf_sg_static_fallback escape=json
    '{"status":$status,"upstream_status":"$upstream_status",'
    '"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
