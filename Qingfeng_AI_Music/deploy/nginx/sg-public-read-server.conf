# Optional Singapore HTTPS routes. Keep the existing dynamic catch-all to Shenzhen.
location = / {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 500ms;
    proxy_read_timeout 1s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @qingfeng_sz_public_fallback;
    add_header X-QF-Origin singapore-read always;
    access_log /var/log/nginx/qingfeng-sg-public-read.log qf_sg_static_fallback;
}

location ^~ /internal/regional/ { return 404; }

location = /__qf_region_ready {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18081/internal/regional/ready;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host localhost;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 500ms;
    proxy_read_timeout 1s;
    access_log off;
}

location @qingfeng_sz_public_fallback {
    limit_except GET { deny all; }
    limit_conn qf_sg_public_fallback 4;
    limit_conn_status 503;
    proxy_connect_timeout 500ms;
    proxy_send_timeout 1s;
    proxy_read_timeout 1s;
    proxy_next_upstream off;
    add_header Retry-After $qf_sg_fallback_retry_after always;
    add_header X-QF-Origin shenzhen-fallback always;
    access_log /var/log/nginx/qingfeng-sg-public-fallback.log qf_sg_static_fallback;
    proxy_pass https://120.77.19.199;
    proxy_ssl_server_name on;
    proxy_ssl_name cheerfulmusic.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_set_header Host cheerfulmusic.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-QF-Primary-Share-Authorized "";
    proxy_hide_header Set-Cookie;
}
