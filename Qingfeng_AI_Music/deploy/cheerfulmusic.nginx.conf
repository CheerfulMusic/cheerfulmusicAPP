server {
    listen 80;
    server_name cheerfulmusic.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/qingfeng-acme; }
    location / { return 301 https://cheerfulmusic.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name cheerfulmusic.com;
    ssl_certificate /etc/letsencrypt/live/cheerfulmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cheerfulmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;

    # OAuth authorization codes must not be retained in access-log query strings.
    location = /api/public/auth/google/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/public/auth/logto/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /actuator {
        return 404;
    }
    location ^~ /actuator/ {
        return 404;
    }
}
