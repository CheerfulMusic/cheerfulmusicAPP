# Central configuration for generation quotas. Restart the backend after editing.
# -1 = unlimited; 0 = no new requests; positive values = the actual limit.
# Testing: all daily limits are unlimited. Usage is still recorded for audit.
# Request deduplication and task-state protection remain active.
qingfeng.usage.zone=Asia/Shanghai

qingfeng.usage.music.daily-per-creator=-1
qingfeng.usage.music.daily-global=-1
qingfeng.usage.music.concurrent-per-creator=1
qingfeng.usage.music.concurrent-global=100

# Execution limits are independent from the user/global admission quotas above.
# Count unresolved submissions as in flight. 0 pauses only new dispatch, not query/archive.
# In-flight admission is coordinated in MySQL across workers and application instances.
qingfeng.generation.max-in-flight=100
qingfeng.generation.submit-workers=2
qingfeng.generation.query-workers=4
qingfeng.generation.archive-workers=2
qingfeng.generation.scan-ms=500

# KIE dashboard: per account <=20 new generation requests in 10 seconds.
# Use 18/10s with smooth spacing, leaving headroom. This is not the in-flight limit.
# Music, cover and timing providers share the same account scope in MySQL.
qingfeng.providers.kie.rate-limit.scope=primary
qingfeng.providers.kie.rate-limit.creates-per-ten-seconds=18
qingfeng.providers.kie.rate-limit.reads-per-second=8
qingfeng.providers.kie.rate-limit.max-wait-seconds=30

qingfeng.usage.lyrics.daily-per-creator=-1
qingfeng.usage.lyrics.daily-global=-1
qingfeng.usage.lyrics.concurrent-per-creator=1
qingfeng.usage.lyrics.concurrent-global=5

qingfeng.usage.timing.daily-per-creator=-1
qingfeng.usage.timing.daily-global=-1
qingfeng.usage.timing.concurrent-per-creator=1
qingfeng.usage.timing.concurrent-global=5

qingfeng.usage.cover.daily-per-creator=-1
qingfeng.usage.cover.daily-global=-1
qingfeng.usage.cover.concurrent-per-creator=1
qingfeng.usage.cover.concurrent-global=2
