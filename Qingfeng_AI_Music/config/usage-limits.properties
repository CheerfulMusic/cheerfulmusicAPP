# Central configuration for generation quotas. Restart the backend after editing.
# -1 = unlimited; 0 = no new requests; positive values = the actual limit.
# Request deduplication and task-state protection remain active.
#
# 成本封顶说明：每次调用都会产生真实上游请求。并发上限只挡「同时」，挡不住「连续」，
# 因此按图/按次计费的上游能力必须同时有每日次数上限，否则成本敞口没有上界。
# 歌词与歌曲生成按积分计费，积分本身已经限定了调用次数，因此每日次数保持不限。
qingfeng.usage.zone=Asia/Shanghai

qingfeng.usage.music.daily-per-creator=-1
qingfeng.usage.music.daily-global=-1
qingfeng.usage.music.concurrent-per-creator=1
qingfeng.usage.music.concurrent-global=3

qingfeng.usage.lyrics.daily-per-creator=-1
qingfeng.usage.lyrics.daily-global=-1
qingfeng.usage.lyrics.concurrent-per-creator=1
qingfeng.usage.lyrics.concurrent-global=5

# 歌词时间轴按音频资产请求一次、失败可重试，50 次/天足够正常收听。
qingfeng.usage.timing.daily-per-creator=50
qingfeng.usage.timing.daily-global=-1
qingfeng.usage.timing.concurrent-per-creator=1
qingfeng.usage.timing.concurrent-global=5

# 封面 AI 按图计费：每天最多生成 20 张，避免单账号的图像成本敞口。
qingfeng.usage.cover.daily-per-creator=20
qingfeng.usage.cover.daily-global=-1
qingfeng.usage.cover.concurrent-per-creator=1
qingfeng.usage.cover.concurrent-global=2
