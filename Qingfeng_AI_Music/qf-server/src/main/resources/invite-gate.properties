# Temporary beta gate. Secrets must come from the environment or a private external file.
# The production file /etc/qingfeng-music/invite-gate.properties overrides these defaults.
qingfeng.invite-gate.enabled=${INVITE_GATE_ENABLED:false}
qingfeng.invite-gate.codes=${INVITE_GATE_CODES:}
qingfeng.invite-gate.signing-key=${INVITE_GATE_SIGNING_KEY:}
qingfeng.invite-gate.session-ttl=${INVITE_GATE_SESSION_TTL:7d}
qingfeng.invite-gate.attempts-per-minute=${INVITE_GATE_ATTEMPTS_PER_MINUTE:10}
qingfeng.invite-gate.secure-cookie=${INVITE_GATE_SECURE_COOKIE:false}
