spring:
  config:
    import:
      - classpath:usage-limits.properties
      - classpath:invite-gate.properties
      - optional:file:/etc/qingfeng-music/invite-gate.properties
  application:
    name: qingfeng-music
  profiles:
    # 当前开发阶段默认启用真实草稿保存；无数据库演示可显式指定 local。
    default: mysql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
qingfeng:
  quick:
    enabled: true
    workers: 4
  credits:
    enabled: true
    music-cost: 15
  auth:
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
    logto:
      enabled: ${LOGTO_LOGIN_ENABLED:false}
      email-enabled: ${LOGTO_EMAIL_ENABLED:false}
      phone-enabled: ${LOGTO_PHONE_ENABLED:false}
  inspiration:
    rewrite:
      enabled: true
      concurrent-global: 4
  cover:
    ai:
      enabled: true
      scheduler-enabled: true
  providers:
    kie:
      # 初始调优值，实际听感需要付费对照试听验证。
      style-weight: 0.85
      weirdness-constraint: 0.25
      variety: 0
      section-audio-weight: 0.85
  lyrics:
    timing:
      enabled: true
  generation:
    enabled: false
    section-editing-enabled: true
    scheduler-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
