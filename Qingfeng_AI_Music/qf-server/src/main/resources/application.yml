spring:
  flyway:
    # Financial V44 requires a separately approved cutover, mapping, and activation.
    target: ${CREDIT_SCHEMA_TARGET:43}
  config:
    import:
      - classpath:usage-limits.properties
      - classpath:invite-gate.properties
  application:
    name: qingfeng-music
  task:
    scheduling:
      pool:
        size: 4
  profiles:
    # 当前开发阶段默认启用真实草稿保存；无数据库演示可显式指定 local。
    default: mysql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
qingfeng:
  payment:
    inbox:
      scheduler-enabled: true
  quick:
    enabled: true
    workers: 4
  credits:
    enabled: true
    writer-fence:
      enabled: ${CREDIT_WRITER_FENCE_ENABLED:false}
      expected-database: ${CREDIT_WRITER_EXPECTED_DATABASE:}
      expected-port: ${CREDIT_WRITER_EXPECTED_PORT:0}
    music-cost: 5
    lyrics-cost: 1
    rewrite-cost: 1
    rewrite-free-per-day: 5
  stripe:
    enabled: false
    accepting-new-orders: false
    environment: ${STRIPE_ENVIRONMENT:sandbox}
    account-id: ${STRIPE_ACCOUNT_ID:}
    api-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:}
    cancel-url: ${STRIPE_CANCEL_URL:}
    business-country: ${STRIPE_BUSINESS_COUNTRY:GB}
    payment-methods:
      card:
        enabled: ${STRIPE_CARD_ENABLED:true}
      apple-pay:
        # Hosted Checkout confirms wallet availability on the customer's device.
        enabled: ${STRIPE_APPLE_PAY_ENABLED:true}
      wechat-pay:
        # Enable only after Stripe approves this merchant; this does not enable Live payments.
        enabled: ${STRIPE_WECHAT_PAY_ENABLED:false}
    prices:
      cny:
        # Independent CNY prices approved by the owner, never an inferred FX conversion.
        starter: ${STRIPE_CNY_STARTER_PRICE:68.80}
        standard: ${STRIPE_CNY_STANDARD_PRICE:178.80}
        plus: ${STRIPE_CNY_PLUS_PRICE:338.80}
  auth:
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
    logto:
      enabled: ${LOGTO_LOGIN_ENABLED:false}
      email-enabled: ${LOGTO_EMAIL_ENABLED:false}
      phone-enabled: ${LOGTO_PHONE_ENABLED:false}
  inspiration:
    rewrite:
      enabled: true
      concurrent-global: 4
      concurrent-per-creator: 1
  music-settings:
    simplify:
      enabled: true
      concurrent-global: 2
      # 每次精简都是一次真实模型请求：用每日次数上限封顶成本敞口。
      daily-per-creator: 20
  reference:
    analysis:
      enabled: true
      concurrent-global: 2
      # 上传参考音频后自动触发，同样用每日次数上限封顶成本敞口。
      daily-per-creator: 20
  cover:
    ai:
      enabled: true
      scheduler-enabled: true
  providers:
    # AI 改写（灵感改写 / 歌词行改写 / 音乐要求精简）默认走千问AI平台千问 Flash 快速版。
    # base-url 必须与签发 key 的平台配套，不能混用阿里云百炼官方域名 dashscope.aliyuncs.com。
    # 密钥严禁写入仓库：由服务器私有配置 qingfeng.providers.qwen.api-key，
    # 或环境变量 aliyunqingfengKEY / DASHSCOPE_API_KEY 注入。
    # 歌词生成主链路仍用 qingfeng.providers.deepseek.*，此处不影响。
    qwen:
      model: qwen3.8-flash
      # 只配到 /v1 即可，代码会自动补齐 /chat/completions。
      base-url: https://maas.qianwenaiapi.com/compatible-mode/v1
    kie:
      # 初始调优值，实际听感需要付费对照试听验证。
      style-weight: 0.85
      weirdness-constraint: 0.25
      variety: 0
      section-audio-weight: 0.85
  lyrics:
    timing:
      enabled: true
  generation:
    enabled: false
    section-editing-enabled: true
    scheduler-enabled: true
management:
  health:
    redis:
      enabled: ${qingfeng.redis.enabled:false}
    rabbit:
      enabled: ${qingfeng.events.rabbit.enabled:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
