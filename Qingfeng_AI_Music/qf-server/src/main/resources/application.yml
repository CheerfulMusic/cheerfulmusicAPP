spring:
  application:
    name: qingfeng-music
  profiles:
    # 当前开发阶段默认启用真实草稿保存；无数据库演示可显式指定 local。
    default: mysql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
qingfeng:
  generation:
    enabled: false
    scheduler-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
