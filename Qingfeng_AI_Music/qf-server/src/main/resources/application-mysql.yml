# 兼容IDEA从工作区、后端根目录或qf-server目录启动；后面的配置优先。
spring:
  config:
    import:
      - optional:file:./Qingfeng_AI_Music/config/local.properties
      - optional:file:../config/local.properties
      - optional:file:./config/local.properties
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/qingfeng_music?serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
